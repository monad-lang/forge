[workspace]
members = [
  "motes/*",
  "games/*",
  "services/*",
]

[workspace.dependencies.forge_app]
path = "motes/forge-app"

[workspace.dependencies.forge_core]
path = "motes/forge-core"

[workspace.dependencies.forge_render]
path = "motes/forge-render"

[workspace.dependencies.forge_scene]
path = "motes/forge-scene"

[workspace.dependencies.forge_schedule]
path = "motes/forge-schedule"

[workspace.dependencies.forge_math]
path = "motes/forge-math"

[workspace.dependencies.forge_reactive]
path = "motes/forge-reactive"

[workspace.dependencies.forge_collide]
path = "motes/forge-collide"

[workspace.dependencies.forge_animate]
path = "motes/forge-animate"

# The WebGL backend. Web-only (`targets = ["web"]`); reached by a game
# through `forge_app::web`, never by the native-tested library.
[workspace.dependencies.forge_webgl]
path = "motes/forge-webgl"

# The browser platform boundary (DOM, events, fetch, WebGL). It is a git
# dependency because it lives in the monad repository, not this one, and is
# not part of the installed toolchain's unpacked `init`/`std`/`runtime`.
#
# `branch = "main"` follows upstream; the exact commit is recorded in
# `mote.lock` (`git_commit`), so builds are reproducible until
# `monad update` moves it. `subdir` names the mote inside a repository that
# holds many.
#
# NOTE: `web_wasm`'s own manifest inherits `init`/`std` from the monad
# workspace root ABOVE it in the checkout, so those resolve to the
# checkout's copies. That is why the web code below lives behind a
# `targets = ["web"]` bin: nothing on the native path reaches this
# dependency, and a native `monad check`/`test` never sees a second `init`.
# Oak: typed HTML views (the UI), its component set, and the browser runtime
# that renders them. Same monad repository and pin as `web_wasm`.
[workspace.dependencies.oak]
git = "https://github.com/monad-lang/monad.git"
branch = "main"
subdir = "motes/oak"

[workspace.dependencies.oak_ui]
git = "https://github.com/monad-lang/monad.git"
branch = "main"
subdir = "motes/oak_ui"

[workspace.dependencies.oak_wasm]
git = "https://github.com/monad-lang/monad.git"
branch = "main"
subdir = "motes/oak_wasm"

[workspace.dependencies.web_wasm]
git = "https://github.com/monad-lang/monad.git"
# Keep current: `monad update` (README.md, "Keeping the monad pin current").
branch = "main"
subdir = "motes/web_wasm"

# Pure JSON, used by the online contract (`motes/forge-online`) and by the
# auth broker. Same monad repository and pin as the web motes.
[workspace.dependencies.json]
git = "https://github.com/monad-lang/monad.git"
branch = "main"
subdir = "motes/json"

# The online contract (pure) and the auth broker (native bin). The broker also
# needs the monad server/client stack, which lives in the same repository and
# pin as `web_wasm`.
[workspace.dependencies.forge_online]
path = "motes/forge-online"

[workspace.dependencies.forge_online_server]
path = "services/forge-online"

[workspace.dependencies.moon]
git = "https://github.com/monad-lang/monad.git"
branch = "main"
subdir = "motes/moon"

[workspace.dependencies.http]
git = "https://github.com/monad-lang/monad.git"
branch = "main"
subdir = "motes/http"

[workspace.dependencies.oauth]
git = "https://github.com/monad-lang/monad.git"
branch = "main"
subdir = "motes/oauth"

[workspace.dependencies.jsonwebtoken]
git = "https://github.com/monad-lang/monad.git"
branch = "main"
subdir = "motes/jsonwebtoken"

[workspace.dependencies.crypto]
git = "https://github.com/monad-lang/monad.git"
branch = "main"
subdir = "motes/crypto"

[workspace.dependencies.moose]
git = "https://github.com/monad-lang/monad.git"
branch = "main"
subdir = "motes/moose"

# AT Protocol OAuth (bumped to the monad aaf39e36 pin in the upstream repo).
[workspace.dependencies.atproto_common]
git = "https://github.com/monad-lang/atproto-monad.git"
branch = "main"
subdir = "motes/atproto_common"

[workspace.dependencies.atproto_identity]
git = "https://github.com/monad-lang/atproto-monad.git"
branch = "main"
