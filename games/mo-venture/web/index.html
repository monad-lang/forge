<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Mo Venture</title>
  <style>
    /* Only the page shell: the canvas, the HUD and the touch controls are
       rendered by the wasm app as an Oak view (forge_app::web). */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8ec5f0; }
    #app { height: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { start } from './web.js';
    start('./app.wasm', '#app').catch((err) => {
      document.getElementById('app').textContent = 'Could not load Mo Venture: ' + err;
    });
  </script>
</body>
</html>
