[mote]
name = "forge_app"
version = "0.1.0"
edition = "2026"

# The web profile is opt-in. `src/main.mo` (the demo bin) and `src/web.mo`
# (the browser host) reach `web_wasm` externs that exist only on the browser
# target, so this mote does not admit `native` and `monad test` drops the
# bin from its sweep (`Mote.native_test_roots`, `Mote.web_only_bin_file`).
# `web.mo` has no `#[test]` defs and `lib.mo` does not re-export it, so no
# native test binary reaches it either. `src/stick.mo` is the native,
# tested half of the touch stick.
targets = ["web"]

[[bin]]
name = "forge-app-web"
path = "src/main.mo"

# Keys are `use`-spelled, so `_` not `-` (directories keep their hyphens).
[dependencies.forge_core]
workspace = true

[dependencies.forge_math]
workspace = true

[dependencies.forge_schedule]
workspace = true

[dependencies.forge_scene]
workspace = true

[dependencies.forge_render]
workspace = true

[dependencies.forge_collide]
workspace = true

[dependencies.forge_animate]
workspace = true

[dependencies.forge_webgl]
workspace = true

# `web_event` names `WsEvent`/`WsData`, which `Subscription.websocket`'s
# handler takes. G9 says these types cannot be reached THROUGH another mote's
# re-export, so the mote that declares them is a direct dependency here.
# The ticket response is JSON (`{"path":...}`); the page parses it with the
# same reader the broker writes it with.
[dependencies.json]
workspace = true

[dependencies.web_event]
workspace = true

[dependencies.oak]
workspace = true

[dependencies.oak_ui]
workspace = true

[dependencies.oak_wasm]
workspace = true

[dependencies.web_wasm]
workspace = true

[dependencies.forge_online]
workspace = true

[dependencies.atproto_common]
workspace = true

[dependencies.atproto_oauth]
workspace = true

[dependencies.atproto_web]
workspace = true
